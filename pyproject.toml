[project]
name = "trade-recon"
version = "0.1.0"
description = "Trade reconciliation platform: deterministic matching + AI break investigation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "httpx>=0.27",
    "yfinance>=0.2",
    "boto3>=1.35",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.2",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
fetch-market-data = "backend.data.fetch_market_data:main"
generate-trades = "backend.data.generator:main"
normalize-trades = "backend.pipeline.ingest:main"
match-trades = "backend.pipeline.matcher:main"
serve-api = "backend.api.main:main"
investigate-breaks = "backend.agent.cli:main"
write-agent-memory = "backend.agent.memory_writer:main"
daily-blotter = "backend.ops.daily_blotter:main"
stop-billing = "backend.ops.billing:main_stop"
start-product = "backend.ops.billing:main_start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.hatch.build.targets.wheel.force-include]
"backend/agent/skills" = "backend/agent/skills"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
